version: '3.8'

services:
  mongodb:
    image: mongo:6-jammy
    container_name: ethiouni_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ethiouni
    volumes:
      - mongo-data:/data/db
    networks:
      - ethiouni-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ethiouni_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017/ethiouni}
      JWT_SECRET: ${JWT_SECRET:-production-secret-key-ethiouni-2026}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:80,http://127.0.0.1}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - ethiouni-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ethiouni_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ethiouni-network

networks:
  ethiouni-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local

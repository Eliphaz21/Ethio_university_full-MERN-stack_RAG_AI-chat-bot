services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ethiouni_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      PORT: 5000
      NODE_ENV: production
      CORS_ORIGINS: http://localhost,http://localhost:80,http://localhost:3000,http://127.0.0.1,http://127.0.0.1:3000
    networks:
      - ethiouni-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ethiouni_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      - backend
    networks:
      - ethiouni-network

networks:
  ethiouni-network:
    driver: bridge

<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Blue Circular Badge -->
  <circle cx="100" cy="105" r="85" fill="#1b3bbb" stroke="#2563eb" stroke-width="6"/>
  <circle cx="100" cy="105" r="76" stroke="#1d4ed8" stroke-width="4"/>

  <!-- Top Right Green Active Status Indicator -->
  <circle cx="150" cy="55" r="18" fill="#00c853" stroke="#1b3bbb" stroke-width="5"/>

  <!-- Robot Antenna -->
  <line x1="100" y1="65" x2="100" y2="50" stroke="#00e5ff" stroke-width="4" stroke-linecap="round"/>
  <circle cx="100" cy="46" r="6" fill="#00e5ff"/>

  <!-- Robot Head -->
  <rect x="62" y="65" width="76" height="50" rx="22" fill="#2d3748"/>
  <circle cx="58" cy="90" r="10" fill="#2d3748"/>
  <circle cx="142" cy="90" r="10" fill="#2d3748"/>

  <!-- Glowing Cyan Eyes -->
  <circle cx="82" cy="92" r="9" fill="#80d8ff"/>
  <circle cx="118" cy="92" r="9" fill="#80d8ff"/>

  <!-- Ethiopian Flag Headband -->
  <g id="headband">
    <!-- Green Stripe -->
    <path d="M 66 75 L 134 75 L 134 81 L 66 81 Z" fill="#009900"/>
    <!-- Yellow Stripe -->
    <path d="M 66 81 L 134 81 L 134 87 L 66 87 Z" fill="#ffcc00"/>
    <!-- Red Stripe -->
    <path d="M 66 87 L 134 87 L 134 93 L 66 93 Z" fill="#cc0000"/>
    <!-- Blue Star Circle -->
    <circle cx="100" cy="84" r="5" fill="#0033aa"/>
    <!-- Star -->
    <polygon points="100,80.5 101.5,83 104,83 102,84.5 103,87 100,85.5 97,87 98,84.5 96,83 98.5,83" fill="#ffcc00"/>
  </g>

  <!-- Robot Body / Torso -->
  <path d="M 70 120 C 70 115 130 115 130 120 L 126 160 C 126 168 74 168 74 160 Z" fill="#f8fafc"/>
  
  <!-- Torso Chest Screen -->
  <rect x="84" y="128" width="32" height="20" rx="4" fill="#e0f7fa"/>
  <line x1="88" y1="135" x2="112" y2="135" stroke="#00b0ff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="88" y1="141" x2="104" y2="141" stroke="#00b0ff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Side Ethiopian Pattern Accents -->
  <!-- Left Side Stripes -->
  <line x1="72" y1="126" x2="78" y2="129" stroke="#cc0000" stroke-width="3" stroke-linecap="round"/>
  <line x1="71" y1="134" x2="77" y2="137" stroke="#ffcc00" stroke-width="3" stroke-linecap="round"/>
  <line x1="72" y1="142" x2="78" y2="145" stroke="#009900" stroke-width="3" stroke-linecap="round"/>

  <!-- Right Side Stripes -->
  <line x1="128" y1="126" x2="122" y2="129" stroke="#cc0000" stroke-width="3" stroke-linecap="round"/>
  <line x1="129" y1="134" x2="123" y2="137" stroke="#ffcc00" stroke-width="3" stroke-linecap="round"/>
  <line x1="128" y1="142" x2="122" y2="145" stroke="#009900" stroke-width="3" stroke-linecap="round"/>
</svg>

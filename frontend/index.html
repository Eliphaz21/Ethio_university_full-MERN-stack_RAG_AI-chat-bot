<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Discover accredited Ethiopian universities, Grade 12 ESSLCE admission criteria, degree programs, and chat with our multilingual RAG AI assistant."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="EthioUni Portal" />
    <meta name="theme-color" content="#059669" />
    <meta name="application-name" content="EthioUni Portal" />
    <meta name="geo.region" content="ET" />
    <meta name="geo.placename" content="Ethiopia" />

    <title>EthioUni Portal - Ethiopian University Directory &amp; AI Assistant</title>

    <!-- Open Graph (fallback before React hydrates) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EthioUni Portal" />
    <meta property="og:title" content="EthioUni Portal - Ethiopian University Directory &amp; AI Assistant" />
    <meta
      property="og:description"
      content="Discover accredited Ethiopian universities, admission requirements, and get AI-powered guidance in five languages."
    />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="/assets/logo.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EthioUni Portal" />
    <meta
      name="twitter:description"
      content="Ethiopian university directory and multilingual AI assistant for students and educators."
    />

    <link rel="canonical" href="https://ethiouni.portal.et/" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="icon" type="image/png" href="/assets/logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Static JSON-LD fallback for crawlers with limited JS -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "EthioUni Portal",
        "url": "https://ethiouni.portal.et/",
        "description": "Ethiopian university directory and multilingual AI assistant",
        "inLanguage": ["en", "am", "om", "ti", "so"]
      }
    </script>
  </head>
  <body>
    <noscript>
      <p>
        EthioUni Portal requires JavaScript. Visit
        <a href="/universities">the universities directory</a>
        or browse Ethiopian university profiles directly.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
